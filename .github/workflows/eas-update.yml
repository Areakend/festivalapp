name: EAS Update

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Update branch/channel to publish to
        required: true
        default: production
        type: choice
        options:
          - development
          - preview
          - production
      message:
        description: Update message (shown in the EAS dashboard)
        required: false
        type: string

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Publishes the current JS bundle over the air to every already-
      # installed build on this branch/channel whose runtimeVersion still
      # matches (app.json pins that to the app version, so this is safe as
      # long as no native dependency changed since the last real build —
      # a native change needs a fresh build from eas-build.yml instead,
      # OTA can't deliver those).
      - name: Publish update
        env:
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          eas update --branch "${{ inputs.branch }}" --message "${UPDATE_MESSAGE:-Update from ${{ github.sha }}}" --non-interactive
